[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nullcut"
version = "0.1.0"
description = "Local AI video editor: analyse once, plan against a style, compile and render deterministically."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "opentimelineio>=0.17",
    "ortools>=9.10",       # CP-SAT duration solver
    "sherpa-onnx>=1.12",   # Parakeet ASR runtime; weights via `nullcut models pull`
    "opencv-python-headless>=4.10",  # faces (YuNet), optical flow, sharpness
    "librosa>=0.10",       # music tempo, beat grid, downbeats
    "httpx>=0.27",         # OpenAI-compatible model servers
    "otio-fcpx-xml-adapter>=1.0",  # FCPXML export for Final Cut and Resolve
    "rapidocr-onnxruntime>=1.3",   # OCR for caption and thumbnail measurement, models bundled
    "onnxruntime>=1.17",   # IS-Net cutout
    "pillow>=10",          # thumbnail composition
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Whisper backends are optional. Auto-selection order: sidecar, WhisperX,
# Parakeet (when pulled), faster-whisper.
whisper = ["faster-whisper>=1.1"]
whisperx = ["whisperx>=3.3"]
dev = ["pytest>=8"]

[project.scripts]
nullcut = "nullcut.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nullcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
